<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lyrics Animation</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to right,#000000,#240046,#5a189a);
            overflow:hidden;
            font-family:Arial;

        }

        .container{

            position:relative;
            width:100%;
            text-align:center;

        }

        h1{

            color:white;
            font-size:60px;
            margin-bottom:100px;
            text-shadow:0px 0px 20px cyan;
            animation:glow 1s infinite alternate;

        }

        .lyrics{

            position:absolute;
            width:100%;
            left:0;

            color:#00f5ff;
            font-size:45px;
            font-weight:bold;

            opacity:0;

            text-shadow:0px 0px 20px #00f5ff;

            animation:show 12s infinite;

        }

        .line1{
            animation-delay:0s;
        }

        .line2{
            animation-delay:3s;
        }

        .line3{
            animation-delay:6s;
        }

        .line4{
            animation-delay:9s;
        }

        @keyframes show{

            0%{
                opacity:0;
                transform:translateY(80px) scale(0.5);
            }

            10%{
                opacity:1;
                transform:translateY(0px) scale(1);
            }

            30%{
                opacity:1;
            }

            40%{
                opacity:0;
                transform:translateY(-80px) scale(1.2);
            }

            100%{
                opacity:0;
            }

        }

        @keyframes glow{

            from{
                text-shadow:0px 0px 10px cyan;
            }

            to{
                text-shadow:
                0px 0px 20px cyan,
                0px 0px 40px cyan,
                0px 0px 80px cyan;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎵 AJI NTSSAM7O 🎵</h1>

        <div class="lyrics line1">
            BOM💥 BOM💥 BOM💥 BOM💥
        </div>

        <div class="lyrics line2">
            Menek majani noum
        </div>

        <div class="lyrics line3">
            Aji 3ndi ntssamho🥹
        </div>

        <div class="lyrics line4">
            OYA ka7lat l3yon😍
        </div>

    </div>

</body>

</html>
